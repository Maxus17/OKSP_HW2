services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.hw2
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp:unconfined]
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    environment:
      API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD}
      API_USER: librarian
      BASE_URL: http://app:8000
      PERSONAL_PREFIX: ${PERSONAL_PREFIX}
    volumes:
      - ./load:/scripts:ro
      - ./results:/results
    working_dir: /scripts
